[package]
name = "clipvue-barber"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = { version = "4", features = ["cookies"] }
actix-cors = "0.7"
actix-files = "0.6"
actix-governor = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled", "chrono"] }
jsonwebtoken = "9"
bcrypt = "0.15"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.9"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
lettre = { version = "0.11", features = ["tokio1", "smtp-transport", "builder", "tokio1-rustls-tls"], default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rand = "0.8"
base64 = "0.22"
regex = "1"
log = "0.4"
env_logger = "0.11"
dotenv = "0.15"
csv = "1"
lazy_static = "1"
p256 = { version = "0.13", features = ["ecdsa", "ecdh"] }
hkdf = "0.12"
aes-gcm = "0.10"
sha2 = "0.10"
