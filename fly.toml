# fly.toml — 7gozati barber booking app
# See https://fly.io/docs/reference/configuration/

app = 'clipvue-barber'
primary_region = 'cdg'

[build]

[env]
  # SQLite lives on the mounted volume so data survives deploys/restarts.
  DATABASE_URL = "/data/clipvue.db"
  # Production mode: Secure cookies + HSTS, and the app refuses to boot
  # without JWT_SECRET / ADMIN_PASS (set those via `fly secrets set`).
  DEV_MODE = "false"

# Persistent disk for the SQLite database. Create it once with:
#   fly volumes create clipvue_data --region cdg --size 1
[mounts]
  source = "clipvue_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Keep one machine always running so the 1-hour reminder loop actually
  # fires and the single volume-backed instance stays consistent.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
